# oh shiny! - a shader pack for Iris and Sodium: Metallum Extra's built-in shaders.

# The game's own extras that the pack replaces or does not want.
oldLighting=false
oldHandLight=false
underwaterOverlay=false
vignette=false
separateAo=false
sun=true
moon=true
stars=true

# Everything near the player casts a shadow, the player too (also in first person). The shadow pass runs even
# with Shadows off: it also draws the map of light colors (see lib/light_colors.glsl).
shadowTerrain=true
shadowTranslucent=true
shadowEntities=true
shadowBlockEntities=true
shadowPlayer=true

# Sun rays and ambient occlusion are worked out at half size (colortex6, blurred into 7, with the depth they were
# worked out from in 15). The glow is a chain of images from half size down to 1/32 (colortex10 to 14).
size.buffer.colortex6=0.5 0.5
size.buffer.colortex7=0.5 0.5
size.buffer.colortex15=0.5 0.5
size.buffer.colortex10=0.5 0.5
size.buffer.colortex11=0.25 0.25
size.buffer.colortex12=0.125 0.125
size.buffer.colortex13=0.0625 0.0625
size.buffer.colortex14=0.03125 0.03125

# Quality. Low has shadows at a short distance and no reflections or ambient occlusion, Medium adds them, High
# adds sun rays and further shadows, Ultra the sharpest and furthest shadows. Medium is the default.
profile.LOW=SHADOWS shadowMapResolution=1024 shadowDistance=64.0 !WATER_REFLECTIONS !SUN_RAYS !AMBIENT_OCCLUSION
profile.MEDIUM=SHADOWS shadowMapResolution=2048 shadowDistance=96.0 WATER_REFLECTIONS !SUN_RAYS AMBIENT_OCCLUSION
profile.HIGH=SHADOWS shadowMapResolution=2048 shadowDistance=128.0 WATER_REFLECTIONS SUN_RAYS AMBIENT_OCCLUSION
profile.ULTRA=SHADOWS shadowMapResolution=4096 shadowDistance=192.0 WATER_REFLECTIONS SUN_RAYS AMBIENT_OCCLUSION

screen=<profile> <empty> SHADOWS COLORED_LIGHT shadowMapResolution shadowDistance AMBIENT_OCCLUSION SUN_RAYS sunPathRotation <empty> WATER_REFLECTIONS WAVING BLOOM SMOOTH_EDGES
screen.columns=2
sliders=shadowMapResolution shadowDistance sunPathRotation
