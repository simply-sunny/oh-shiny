# oh shiny! - a shader pack for Iris and Sodium: Metallum Extra's built-in shaders.

# The game's own extras that the pack replaces or does not want.
oldLighting=false
oldHandLight=false
underwaterOverlay=false
vignette=false
separateAo=false
sun=true
moon=true
stars=true

# With Shadows on, everything near the player casts a shadow, the player too (also in first person). With them
# off, the shadow pass only draws the map of light colors (lib/light_colors.glsl), which needs the terrain and
# nothing else, and with Colored Light off too it draws nothing.
#ifdef SHADOWS
shadowTerrain=true
shadowTranslucent=true
#ifdef MOB_SHADOWS
shadowEntities=true
shadowBlockEntities=true
shadowPlayer=true
#else
shadowEntities=false
shadowBlockEntities=false
shadowPlayer=false
#endif
#else
shadowTranslucent=false
shadowEntities=false
shadowBlockEntities=false
shadowPlayer=false
#ifdef COLORED_LIGHT
shadowTerrain=true
#else
shadowTerrain=false
#endif
#endif

# Sun rays and ambient occlusion are worked out at half size (colortex6, blurred into 7, with the depth they were
# worked out from in 15). The glow is a chain of images from half size down to 1/32 (colortex10 to 14).
size.buffer.colortex6=0.5 0.5
size.buffer.colortex7=0.5 0.5
size.buffer.colortex15=0.5 0.5
size.buffer.colortex10=0.5 0.5
size.buffer.colortex11=0.25 0.25
size.buffer.colortex12=0.125 0.125
size.buffer.colortex13=0.0625 0.0625
size.buffer.colortex14=0.03125 0.03125

# Distant Horizons: its far-off terrain is drawn by dh_terrain and dh_water (program/lod.fsh), lit like the
# rest. It casts no shadows: the shadow map only reaches Shadow Distance, and drawing every far-off chunk into
# it would only cost time. Voxy (Iris only) reads voxy.json instead: Voxy draws its far-off terrain with its own
# shaders, has them call voxy_emitFragment (voxy_opaque.glsl, voxy_translucent.glsl, program/voxy.glsl), and
# declares for them the uniforms voxy.json lists, which must be every one lib/uniforms.glsl declares.
dhShadow.enabled=false

# Quality. Low has shadows at a short distance, none from mobs, and no reflections or ambient occlusion, Medium adds them, High
# adds sun rays and further shadows, Ultra the sharpest and furthest shadows. Medium is the default.
profile.LOW=SHADOWS !MOB_SHADOWS shadowMapResolution=1024 shadowDistance=64.0 !WATER_REFLECTIONS !SUN_RAYS !AMBIENT_OCCLUSION
profile.MEDIUM=SHADOWS MOB_SHADOWS shadowMapResolution=2048 shadowDistance=96.0 WATER_REFLECTIONS !SUN_RAYS AMBIENT_OCCLUSION
profile.HIGH=SHADOWS MOB_SHADOWS shadowMapResolution=2048 shadowDistance=128.0 WATER_REFLECTIONS SUN_RAYS AMBIENT_OCCLUSION
profile.ULTRA=SHADOWS MOB_SHADOWS shadowMapResolution=4096 shadowDistance=192.0 WATER_REFLECTIONS SUN_RAYS AMBIENT_OCCLUSION

screen=<profile> <empty> SHADOWS MOB_SHADOWS shadowMapResolution shadowDistance PIXEL_SHADOWS PIXEL_SHADOWS_SIZE COLORED_LIGHT HAND_LIGHT AMBIENT_OCCLUSION SUN_RAYS sunPathRotation WATER_REFLECTIONS WAVING BLOOM SMOOTH_EDGES FOG_START
screen.columns=2
sliders=shadowMapResolution shadowDistance PIXEL_SHADOWS_SIZE sunPathRotation FOG_START

# Passes skipped when their option is off. Written by tools/stages.py.
program.deferred.enabled=WATER_REFLECTIONS
program.composite.enabled=AMBIENT_OCCLUSION || SUN_RAYS
program.composite1.enabled=AMBIENT_OCCLUSION || SUN_RAYS
program.composite2.enabled=AMBIENT_OCCLUSION || SUN_RAYS
program.composite3.enabled=BLOOM
program.composite4.enabled=BLOOM
program.composite5.enabled=BLOOM
program.composite6.enabled=BLOOM
program.composite7.enabled=BLOOM
program.composite8.enabled=BLOOM
program.composite9.enabled=BLOOM
program.composite10.enabled=BLOOM
program.composite11.enabled=BLOOM
# End of passes skipped.
